    <style type="text/tailwindcss">
    @layer theme {
        :root {
            --primary-color: #4b2d85;
            --secondary-color: #160c41;
            --accent-blue: #6b4ba8;
            --bg-dark: #0a0a0a;
            --bg-card: #1b1c1d;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --gradient-start: #4b2d85;
            --gradient-end: #160c41;
            --blur-dark-blue: #2d1654;
        }
    }

    @layer base {
        body {
            font-family: 'Default', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-primary);
        }
        
        html {
            scroll-behavior: smooth;
        }
    }

    @layer utilities {
        strong, b, .font-bold, .font-semibold {
            font-family: 'AI_Text_Bold', 'Default', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.5; filter: blur(60px); }
            50% { opacity: 0.8; filter: blur(80px); }
        }
        
        @keyframes gradient-shift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        
        @keyframes shimmer {
            0% {
                background-position: -200% center;
            }
            100% {
                background-position: 200% center;
            }
        }
        
        @keyframes fadeinslideup {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
        
        .animate-pulse-glow {
            animation: pulse-glow 4s ease-in-out infinite;
        }
        
        .animate-gradient {
            background-size: 200% 200%;
            animation: gradient-shift 8s ease infinite;
        }
        
        .fade-in-up {
            opacity: 0;
            transform: translateY(40px);
        }
        
        .fade-in-up.visible {
            animation: fadeinslideup 0.8s ease-out forwards;
        }
        
        .blur-light {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.3;
            pointer-events: none;
        }
    }

    @layer components {
        .gradient-text {
            position: relative;
            display: inline-block;
            background: linear-gradient(135deg, var(--gradient-start) 30%, #6b4ba8 60%, var(--gradient-end) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .gradient-text::before {
            content: attr(data-text);
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.6) 50%, transparent 100%);
            background-size: 200% 100%;
            background-position: -200% center;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 5s ease-in-out infinite;
            pointer-events: none;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
            padding: 0.875rem 2.5rem;
            border-radius: 1rem;
            font-weight: 600;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px rgba(75, 45, 133, 0.3);
            position: relative;
            overflow: hidden;
        }
        
        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }
        
        .btn-primary:hover::before {
            left: 100%;
        }
        
        .btn-primary:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 35px rgba(75, 45, 133, 0.5);
        }
        
        .btn-secondary {
            backdrop-filter: blur(10px);
            background: rgba(75, 45, 133, 0.1);
            border: 2px solid var(--primary-color);
            padding: 0.875rem 2.5rem;
            border-radius: 1rem;
            font-weight: 600;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .btn-secondary:hover {
            background: rgba(75, 45, 133, 0.2);
            border-color: var(--accent-blue);
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 25px rgba(75, 45, 133, 0.3);
        }
        
        .feature-card {
            background: var(--bg-dark)/80;
            backdrop-filter: blur(16px);
            border-radius: 1.5rem;
            padding: 2rem;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        
        .feature-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(75, 45, 133, 0.1) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        
        .feature-card:hover::before {
            opacity: 1;
        }
        
        .feature-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 25px 50px rgba(75, 45, 133, 0.3);
            border-color: rgba(255, 255, 255, 0.2);
            background: var(--bg-dark)/90;
        }
        
        .tech-badge {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 1.25rem 2rem;
            border-radius: 1rem;
            font-weight: 600;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .tech-badge:hover {
            border-color: rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.08) translateY(-2px);
            box-shadow: 0 8px 20px rgba(75, 45, 133, 0.3);
        }
    }

<body>
    <div id="root"></div>
    
    <script>
      // Intersection Observer for scroll animations
      document.addEventListener('DOMContentLoaded', () => {
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('visible');
              observer.unobserve(entry.target);
            }
          });
        }, {
          threshold: 0.1,
          rootMargin: '0px'
        });

        // Observe all elements with fade-in-up class
        const animatedElements = document.querySelectorAll('.fade-in-up');
        animatedElements.forEach(el => observer.observe(el));
        
        // Re-observe on dynamic content
        const mutationObserver = new MutationObserver(() => {
          document.querySelectorAll('.fade-in-up:not(.visible)').forEach(el => {
            if (!el.dataset.observed) {
              observer.observe(el);
              el.dataset.observed = 'true';
            }
          });
        });
        
        mutationObserver.observe(document.body, {
          childList: true,
          subtree: true
        });
      });
    </script>
