name: clustrix
description: "Clustrix AI - Multi-Provider AI Chat Platform"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8
  lucide_icons: ^0.257.0
  
  # State Management
  provider: ^6.1.2
  
  # Database
  sqflite: ^2.4.2
  path: ^1.9.1
  
  # HTTP & API
  http: ^1.3.0
  
  # Storage
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  
  # UI
  flutter_markdown: ^0.7.7
  flutter_syntax_view: ^4.0.0
  shimmer: ^3.0.0
  webview_flutter: ^4.10.0
  
  # Auth
  google_sign_in: ^6.3.0
  
  # Utils
  uuid: ^4.5.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # Custom fonts matching React Native version
  fonts:
    - family: CapricornUSRText
      fonts:
        - asset: assets/fonts/Capricorn-USR-Text.otf
    - family: CapricornDisplay
      fonts:
        - asset: assets/fonts/Capricorn-Display.otf
    - family: CapricornDisplayItalic
      fonts:
        - asset: assets/fonts/Capricorn-Display-Italic.otf
          style: italic
    - family: CapricornAIText
      fonts:
        - asset: assets/fonts/Capricorn-AI-Text-Bold-2.otf
    - family: AnthropicSerifAITextBold
      fonts:
        - asset: assets/fonts/AnthropicSerif-AI-Text-Bold.otf
          weight: 700
    - family: ClaudeCode
      fonts:
        - asset: assets/fonts/ClaudeCode.otf
