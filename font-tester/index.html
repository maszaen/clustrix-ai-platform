<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Font Preview Tool</title>
  <style>
    /* START: FONT-FACE RULES */
    @font-face { font-family: "177b7db6a26ff4c3-s.p"; src: url("./177b7db6a26ff4c3-s.p.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: "183a0d33cd5ef006-s.p"; src: url("./183a0d33cd5ef006-s.p.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: "2cc8547efe9f163a-s.p"; src: url("./2cc8547efe9f163a-s.p.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: "2d21c5135ef46b39-s.p"; src: url("./2d21c5135ef46b39-s.p.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: "3b066fe34f61f169-s.p"; src: url("./3b066fe34f61f169-s.p.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: "4e8887750eb14755-s.p"; src: url("./4e8887750eb14755-s.p.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: "5cc13524e09f5d21-s.p"; src: url("./5cc13524e09f5d21-s.p.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: "5fee9713a1748cc9-s.p"; src: url("./5fee9713a1748cc9-s.p.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: "6a2030c2a5787e7a-s.p"; src: url("./6a2030c2a5787e7a-s.p.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: "8217ebd4682cfe49-s.p"; src: url("./8217ebd4682cfe49-s.p.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: "a0eafab536ffd221-s.p"; src: url("./a0eafab536ffd221-s.p.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: "a72997480c14a9d4-s.p"; src: url("./a72997480c14a9d4-s.p.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: "ae9d065a0123ed8a-s.p"; src: url("./ae9d065a0123ed8a-s.p.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: "b8c97ebabd0473a4-s.p"; src: url("./b8c97ebabd0473a4-s.p.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: "b96accb76593e50d-s.p"; src: url("./b96accb76593e50d-s.p.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: "cfe503504e29ad5d-s.p"; src: url("./cfe503504e29ad5d-s.p.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: "d13ff1ddfcb21419-s.p"; src: url("./d13ff1ddfcb21419-s.p.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: "d4ad98ce6ee578c0-s.p"; src: url("./d4ad98ce6ee578c0-s.p.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: "d7440d3c533a1aec-s.p"; src: url("./d7440d3c533a1aec-s.p.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: "db2277a4dc542e54-s.p"; src: url("./db2277a4dc542e54-s.p.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: "f6f0b26c2c0e7b63-s.p"; src: url("./f6f0b26c2c0e7b63-s.p.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: swap; }
    /* END: FONT-FACE RULES */

    /* --- Minimalist Base Styles --- */
    :root {
      --border-color: #e2e8f0;
      --background-color: #f8fafc;
      --text-color: #1e293b;
      --text-muted: #64748b;
      --border-radius: 8px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #ededed;
      color: var(--text-color);
      padding: 24px;
    }
    .container {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      font-size: 2rem;
      font-weight: 600;
      margin-bottom: 24px;
      letter-spacing: -0.5px;
    }
    .controls {
      display: flex;
      gap: 16px;
      margin-bottom: 32px;
      padding-bottom: 32px;
      border-bottom: 1px solid var(--border-color);
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-end;
    }
    .input-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 0.875rem; font-weight: 500; color: var(--text-muted); }
    input, select, textarea {
      padding: 8px 12px;
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius);
      font-size: 1rem;
      background-color: #fff;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #334155;
      box-shadow: 0 0 0 3px rgba(148, 163, 184, 0.2);
    }
    #customText { min-width: 350px; resize: vertical; min-height: 42px; }
    #fontSize { width: 80px; }
    #fontWeight { width: 120px; }

    /* --- Font Preview Card --- */
    #previewList { display: flex; flex-direction: column; gap: 16px; }
    .font-preview {
      padding: 20px;
      background: #fff;
      border-radius: var(--border-radius);
      border: 1px solid var(--border-color);
      transition: box-shadow 0.2s ease, transform 0.2s ease;
      cursor: grab;
      transition: transform 0.2s ease-in-out,
              opacity 0.2s ease,
              height 0.25s ease-in-out,
              padding-top 0.25s ease-in-out,
              padding-bottom 0.25s ease-in-out,
              margin-bottom 0.25s ease-in-out;
    }
    .font-preview:active { cursor: grabbing; }

    .font-name {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-color);
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }
    .sample-text { line-height: 1.6; word-wrap: break-word; }
    
    .size-variants {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 12px;
      margin-top: 20px;
    }
    .size-sample {
      padding: 12px;
      background: var(--background-color);
      border-radius: var(--border-radius);
      border: 1px solid var(--border-color);
    }
    .size-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .size-content { word-wrap: break-word; }

    /* --- Drag & Drop UX Styles --- */
    .font-preview.dragging {
      opacity: 0;
      height: 0;
      padding-top: 0;
      padding-bottom: 0;
      margin-bottom: 0;
      overflow: hidden; /* Penting agar konten tidak tumpah saat kolaps */
      border-width: 0; /* Jika ada border, ini juga dianimasikan */
    }

    /* Placeholder visual untuk drop target yang stabil */
    .dnd-placeholder {
      height: 0; /* Mulai dari tinggi 0 */
      background: rgba(100, 116, 139, 0.05);
      border: 1px dashed #cbd5e1;
      border-radius: var(--border-radius);
      margin: 0;
      transition: height 0.2s ease-in-out, margin 0.2s ease-in-out;
    }

    /* State saat placeholder TERLIHAT (tumbuh ke ukuran penuh) */
    .dnd-placeholder.visible {
      height: 120px; /* Sesuaikan dengan tinggi perkiraan kartu */
      margin: 8px 0; /* Beri jarak seperti kartu biasa */
    }

    /* --- Responsive --- */
    @media (max-width: 768px) {
      body { padding: 16px; }
      .controls { flex-direction: column; align-items: stretch; }
      #customText { min-width: auto; width: 100%; }
      .size-variants { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Font Preview Tool</h1>

    <div class="controls">
      <div class="input-group">
        <label for="customText">Preview Text</label>
        <textarea id="customText">The quick brown fox jumps over the lazy dog.</textarea>
      </div>
      <div class="input-group">
        <label for="fontSize">Size (px)</label>
        <input type="number" id="fontSize" value="28" min="12" max="96" />
      </div>
      <div class="input-group">
        <label for="fontWeight">Weight</label>
        <select id="fontWeight">
          <option value="400">Regular</option>
          <option value="500">Medium</option>
          <option value="600">Semi Bold</option>
          <option value="700">Bold</option>
          <option value="800">Extra Bold</option>
          <option value="900">Black</option>
        </select>
      </div>
    </div>

    <div id="previewList"></div>
  </div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  // ====== FONT LIST (Urutan default) ======

  // START: FONT-FAMILIES ARRAY
  let fontFamilies = [
    "177b7db6a26ff4c3-s.p", "183a0d33cd5ef006-s.p", "2cc8547efe9f163a-s.p",
    "2d21c5135ef46b39-s.p", "3b066fe34f61f169-s.p", "4e8887750eb14755-s.p",
    "5cc13524e09f5d21-s.p", "5fee9713a1748cc9-s.p", "6a2030c2a5787e7a-s.p",
    "8217ebd4682cfe49-s.p", "a0eafab536ffd221-s.p", "a72997480c14a9d4-s.p",
    "ae9d065a0123ed8a-s.p", "b8c97ebabd0473a4-s.p", "b96accb76593e50d-s.p",
    "cfe503504e29ad5d-s.p", "d13ff1ddfcb21419-s.p", "d4ad98ce6ee578c0-s.p",
    "d7440d3c533a1aec-s.p", "db2277a4dc542e54-s.p", "f6f0b26c2c0e7b63-s.p",
  ];
  // END: FONT-FAMILIES ARRAY
  
  const previewList = document.getElementById("previewList");
  const customText = document.getElementById("customText");
  const fontSize = document.getElementById("fontSize");
  const fontWeight = document.getElementById("fontWeight");
  const LOCAL_STORAGE_KEY = "fontOrder";

  // ==== Muat urutan yang tersimpan dari localStorage ====
  function loadOrder() {
    const savedOrder = JSON.parse(localStorage.getItem(LOCAL_STORAGE_KEY) || "null");
    if (Array.isArray(savedOrder) && savedOrder.length) {
      const knownFonts = savedOrder.filter(f => fontFamilies.includes(f));
      const newFonts = fontFamilies.filter(f => !savedOrder.includes(f));
      fontFamilies = [...knownFonts, ...newFonts];
    }
  }

  // ===== Render semua card font =====
  function renderCards() {
    previewList.innerHTML = "";
    fontFamilies.forEach((family) => {
      const card = document.createElement("div");
      card.className = "font-preview";
      card.draggable = true;
      card.dataset.family = family;

      const fontStyle = `font-family: '${family}', system-ui, sans-serif;`;

      card.innerHTML = `
        <div class="font-name">${family}</div>
        <div class="sample-text" style="${fontStyle}"></div>
        <div class="size-variants">
          <div class="size-sample">
            <div class="size-label">Heading (32px)</div>
            <div class="size-content" style="${fontStyle} font-size:32px; font-weight:700;">Design is what it looks like</div>
          </div>
          <div class="size-sample">
            <div class="size-label">Subheading (20px)</div>
            <div class="size-content" style="${fontStyle} font-size:20px; font-weight:600;">Design is how it works</div>
          </div>
          <div class="size-sample">
            <div class="size-label">Body (16px)</div>
            <div class="size-content" style="${fontStyle} font-size:16px; font-weight:400;">Lorem ipsum dolor sit amet, consectetur adipiscing elit.</div>
          </div>
        </div>
      `;
      previewList.appendChild(card);
    });
    updatePreviewText();
  }

  // ===== Update teks preview di semua card =====
  function updatePreviewText() {
    const text = customText.value;
    const size = `${fontSize.value}px`;
    const weight = fontWeight.value;
    document.querySelectorAll(".sample-text").forEach((el) => {
      el.textContent = text;
      el.style.fontSize = size;
      el.style.fontWeight = weight;
    });
  }

  // ===== REFACTORED: Drag & Drop Sort yang lebih stabil & modern =====
  function enableDragSort() {
  let draggingEl = null;
  const placeholder = document.createElement("div");
  placeholder.className = "dnd-placeholder";

  previewList.addEventListener("dragstart", (e) => {
    const target = e.target.closest(".font-preview");
    if (!target) return;
    
    draggingEl = target;
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", target.dataset.family);

    // Timeout PENTING: browser perlu mengambil 'snapshot' kartu sebelum kita membuatnya kolaps
    setTimeout(() => {
      draggingEl.classList.add("dragging");
    }, 0);
  });

  previewList.addEventListener("dragover", (e) => {
    e.preventDefault();
    const afterElement = getDragAfterElement(previewList, e.clientY);
    
    // Masukkan placeholder ke posisi yang benar
    if (afterElement) {
      previewList.insertBefore(placeholder, afterElement);
    } else {
      previewList.appendChild(placeholder);
    }
    
    // Tampilkan placeholder dengan animasi 'tumbuh'
    // Cek dulu apakah sudah visible untuk menghindari flicker
    if (!placeholder.classList.contains('visible')) {
      placeholder.classList.add('visible');
    }
  });
  
  // Event untuk handle saat drag keluar dari container
  previewList.addEventListener("dragleave", (e) => {
    // Jika kursor keluar dari previewList, sembunyikan placeholder
    if (e.relatedTarget === null || !previewList.contains(e.relatedTarget)) {
      placeholder.classList.remove('visible');
    }
  });

  previewList.addEventListener("dragend", () => {
    if (!draggingEl) return;
    // Cleanup: kembalikan state kartu dan hilangkan placeholder
    draggingEl.classList.remove("dragging");
    placeholder.classList.remove('visible');
    if (placeholder.parentNode) {
      setTimeout(() => placeholder.remove(), 200); // Beri waktu untuk animasi kolaps
    }
    draggingEl = null;
  });

  previewList.addEventListener("drop", (e) => {
    e.preventDefault();
    if (!draggingEl) return;
    
    // Saat drop, tempatkan kartu di posisi placeholder
    if (placeholder.parentNode) {
      placeholder.parentNode.insertBefore(draggingEl, placeholder);
    }
    
    // Urutan kartu sekarang sudah final, simpan.
    persistOrder();
  });

  // Helper: mencari elemen setelah posisi pointer (tidak ada perubahan di sini)
  function getDragAfterElement(container, y) {
    const draggableElements = [...container.querySelectorAll(".font-preview:not(.dragging)")];
    return draggableElements.reduce((closest, child) => {
      const box = child.getBoundingClientRect();
      const offset = y - box.top - box.height / 2;
      if (offset < 0 && offset > closest.offset) {
        return { offset: offset, element: child };
      } else {
        return closest;
      }
    }, { offset: Number.NEGATIVE_INFINITY }).element;
  }
}

  // ===== Simpan urutan baru ke localStorage =====
  function persistOrder() {
    const newOrder = [...previewList.querySelectorAll(".font-preview")].map(el => el.dataset.family);
    localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(newOrder));
    fontFamilies = newOrder; // Update array di memory
  }

  // ===== Inisialisasi Aplikasi =====
  function init() {
    // Event listeners untuk kontrol
    customText.addEventListener("input", updatePreviewText);
    fontSize.addEventListener("input", updatePreviewText);
    fontWeight.addEventListener("change", updatePreviewText);

    loadOrder();
    renderCards();
    enableDragSort();
  }

  init();
});
</script>

</body>
</html>
